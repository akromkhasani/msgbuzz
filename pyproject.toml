[project]
name = "msgbuzz"
description = "Generic message bus abstraction. Supported implementation: RabbitMQ, Supabase Queue, PgMQ."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Akrom Khasani", email = "akromkhasani@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["pika~=1.4.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
]
dynamic = ["version"]

[project.optional-dependencies]
supabase = ["supabase~=2.34.1"]
pgmq = ["pgmq~=1.1.4"]

[project.urls]
Homepage = "https://github.com/akromkhasani/msgbuzz"

[build-system]
requires = ["setuptools~=84.2.1", "wheel~=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests*", "examples", "examples*"]

[tool.setuptools.dynamic]
version = { attr = "msgbuzz.__version__" }
